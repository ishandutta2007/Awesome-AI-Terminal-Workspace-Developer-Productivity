<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    
    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .term-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Dynamic Glowing Background Orbs (Placed behind all content) -->
  <circle cx="180" cy="120" r="100" fill="#38bdf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="120;180;120" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.10;0.18;0.10" dur="8s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="1020" cy="220" r="130" fill="#818cf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="1020;950;1020" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="220;160;220" dur="11s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="9s" repeatCount="indefinite" />
  </circle>

  <circle cx="600" cy="360" r="120" fill="#c084fc" opacity="0.08" filter="url(#glow)">
    <animate attributeName="r" values="120;150;120" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Content: Header Tag Pill -->
  <g transform="translate(60, 48)">
    <rect width="320" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" class="badge-text" fill="#38bdf8">⚡ CURATED ECOSYSTEM &amp; RADAR</text>
  </g>

  <!-- Foreground Content: Title & Subtitle (Always in Foreground) -->
  <g transform="translate(60, 125)">
    <text class="title-text" fill="url(#primaryTextGrad)">AI Terminal &amp; Developer Productivity</text>
    <text y="42" class="subtitle-text">Curated guide to Next-Gen AI Shells, Multiplexers, Autonomous TUI Agents &amp; Workspaces</text>
  </g>

  <!-- Interactive Terminal Graphic Mockup (Side Display) -->
  <g transform="translate(680, 205)">
    <!-- Terminal Window -->
    <rect width="460" height="175" rx="10" fill="#030712" stroke="#334155" stroke-width="1.2" opacity="0.95" />
    <!-- Window Bar -->
    <rect width="460" height="26" rx="10" fill="#0f172a" />
    <rect width="460" height="12" y="14" fill="#0f172a" />
    <circle cx="16" cy="13" r="4.5" fill="#ef4444" />
    <circle cx="32" cy="13" r="4.5" fill="#f59e0b" />
    <circle cx="48" cy="13" r="4.5" fill="#10b981" />
    <text x="230" y="17" fill="#64748b" font-size="11" font-family="monospace" text-anchor="middle">terminal-ai-workspace ~ zsh</text>

    <!-- Terminal Output -->
    <g transform="translate(18, 48)" class="term-code">
      <text fill="#38bdf8">$ <tspan fill="#e2e8f0">agent run</tspan> <tspan fill="#a5b4fc">--task "diagnose &amp; optimize cluster latency"</tspan></text>
      <text y="24" fill="#10b981">✔ Connected to local k8s context [us-east-prod]</text>
      <text y="46" fill="#facc15">ℹ Synthesizing multi-pane TUI telemetry...</text>
      <text y="68" fill="#e2e8f0">⚡ Applying MCP workflow across 3 terminal tabs</text>
      <text y="92" fill="#38bdf8">❯ <tspan fill="#34d399">Ready.</tspan> <tspan fill="#e2e8f0">Waiting for next command</tspan><tspan fill="#38bdf8">█</tspan>
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </text>
    </g>
  </g>

  <!-- Foreground Feature Badges / Capability Highlights -->
  <g transform="translate(60, 215)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="26" class="badge-text" fill="#38bdf8">🤖 AI Coding Agents</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="190" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="26" class="badge-text" fill="#a78bfa">🗂️ TUI Multiplexers</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(398, 0)">
      <rect width="185" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="26" class="badge-text" fill="#34d399">✨ GPU-Accelerated CLI</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(0, 56)">
      <rect width="180" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="26" class="badge-text" fill="#f472b6">⚡ Inline Autocomplete</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(195, 56)">
      <rect width="190" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="26" class="badge-text" fill="#fb923c">🔌 MCP Tools &amp; Plugins</text>
    </g>
    <!-- Pill 6 -->
    <g transform="translate(398, 56)">
      <rect width="185" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
      <text x="14" y="26" class="badge-text" fill="#60a5fa">🌐 SaaS &amp; Open-Source</text>
    </g>
  </g>

  <!-- Bottom Pulse Glow Line -->
  <line x1="60" y1="395" x2="1140" y2="395" stroke="#334155" stroke-width="1" />
  <line x1="60" y1="395" x2="280" y2="395" stroke="url(#primaryTextGrad)" stroke-width="2.5">
    <animate attributeName="x1" values="60;920;60" dur="6s" repeatCount="indefinite" />
    <animate attributeName="x2" values="280;1140;280" dur="6s" repeatCount="indefinite" />
  </line>
</svg>
